<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退貨品員工銷售</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eef2f4; --surface:#ffffff; --surface2:#f6f8f9; --text:#17242b; --muted:#5f6f78;
  --border:#d6dee2; --accent:#14606b; --accent-ink:#ffffff; --accent-soft:#dcedef;
  --danger:#b3362b; --danger-soft:#fbe7e5; --warn:#94600f; --warn-soft:#fbf0d9;
  --ok:#2c7a4b; --ok-soft:#e1f2e7; --pay:#0f3d45; --pay-ink:#f1fbfc; --pay-muted:#a9cfd5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121a1e; --surface:#1a252a; --surface2:#202d33; --text:#e4ecef; --muted:#93a5ad;
    --border:#2e3f46; --accent:#4bb0bb; --accent-ink:#0d1a1d; --accent-soft:#1d3a3f;
    --danger:#ec7a6f; --danger-soft:#3b211f; --warn:#e3b45c; --warn-soft:#3a2f18;
    --ok:#6cc893; --ok-soft:#1c3527; --pay:#0c2d33; --pay-ink:#eafafc; --pay-muted:#8fbcc3;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.num,.money{font-variant-numeric:tabular-nums}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.bar{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;letter-spacing:.02em}
nav{display:flex;gap:4px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.tab:hover{background:var(--surface2)}
.tab.active{background:var(--accent-soft);color:var(--accent)}
.backupWarn{margin-left:auto;font-size:13px;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:6px;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding:20px}
h2{font-size:17px;margin:0 0 12px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.grid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(320px,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.scanWrap{position:relative;margin-bottom:14px}
.scan{width:100%;font-size:20px;padding:14px 16px;border:2px solid var(--accent);border-radius:10px;background:var(--surface);outline:none}
.scan:focus{box-shadow:0 0 0 4px var(--accent-soft)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;z-index:15;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sug div{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sug div:hover{background:var(--accent-soft)}
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
td.num,th.num{text-align:right}
.empty{text-align:center;color:var(--muted);padding:36px 8px}
.pname{font-weight:600}
.sub{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--surface);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
input.price{width:110px;text-align:right}
input.missing{border-color:var(--danger);background:var(--danger-soft)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:30px;height:32px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;cursor:pointer}
.qty input{width:56px;text-align:center}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.big{padding:13px 18px;font-size:17px}
.icon{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:16px;padding:4px 8px;border-radius:6px}
.icon:hover{background:var(--danger-soft);color:var(--danger)}
.totals{display:flex;justify-content:space-between;align-items:baseline;padding:14px 8px 4px;font-size:15px}
.totals strong{font-size:24px}
.pay{background:var(--pay);color:var(--pay-ink);border-radius:12px;padding:18px}
.pay .lbl{color:var(--pay-muted);font-size:13px}
.pay .amount{font-size:44px;font-weight:700;line-height:1.1;margin:2px 0 14px}
.pay .acct{font-size:26px;font-weight:700;letter-spacing:.04em;word-break:break-all}
.pay .row{margin-bottom:10px}
.pay .noBank{background:rgba(255,255,255,.1);padding:10px;border-radius:8px;font-size:14px}
.payBtn{background:transparent;border:1px solid var(--pay-muted);color:var(--pay-ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.form{display:grid;gap:10px;margin-top:14px}
.form label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .primary{flex:1}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.filters > div{min-width:130px}
.filters label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.stats{display:flex;gap:22px;flex-wrap:wrap;padding:10px 4px 14px;color:var(--muted);font-size:14px}
.stats b{color:var(--text);font-size:17px}
.pill{border:0;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;cursor:pointer}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
tr.detail td{background:var(--surface2);font-size:14px}
tr.flash td{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:220px}
.cell{padding:5px 8px}
.note{font-size:13px;color:var(--muted);line-height:1.7}
.sectionGap{margin-top:18px}
#modal{position:fixed;inset:0;background:rgba(8,20,24,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
#modalBox{background:var(--surface);border-radius:14px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modalBox.wide{width:min(760px,100%)}
#modalBox h3{margin:0 0 12px;font-size:18px}
.showPay{background:var(--pay);color:var(--pay-ink);border-radius:12px;padding:28px;text-align:center}
.showPay .amount{font-size:72px;font-weight:700;line-height:1}
.showPay .acct{font-size:44px;font-weight:700;letter-spacing:.05em;word-break:break-all}
.showPay .lbl{color:var(--pay-muted);margin-top:18px}
.showPay .bank{font-size:26px;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:10px;background:var(--text);color:var(--surface);font-weight:600;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
#toast.warn{background:var(--warn);color:#fff}
#toast.ok{background:var(--ok);color:#fff}
.chk{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--border)}
.chk input{width:auto}
@media (prefers-reduced-motion:reduce){tr.flash td{animation:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">退貨品員工銷售</div>
    <nav>
      <button class="tab active" data-tab="checkout">結帳</button>
      <button class="tab" data-tab="orders">訂單紀錄</button>
      <button class="tab" data-tab="products">商品主檔</button>
      <button class="tab" data-tab="settings">設定</button>
    </nav>
    <div id="backupWarn" class="backupWarn" hidden></div>
  </div>
</header>

<main>
<!-- 結帳 -->
<section class="page" id="page-checkout">
  <div class="grid">
    <div class="panel">
      <div class="scanWrap">
        <input id="scan" class="scan" type="text" placeholder="刷國際條碼，或輸入料號／品名" autocomplete="off">
        <div id="sug" class="sug" hidden></div>
        <div class="hint">刷到主檔沒有的條碼，會直接跳出新增視窗。單價空白的品項，請在表格中輸入。</div>
      </div>
      <div class="tableWrap">
        <table>
          <thead><tr><th>#</th><th>品名</th><th class="num">單價</th><th>數量</th><th class="num">小計</th><th></th></tr></thead>
          <tbody id="cartBody"></tbody>
        </table>
      </div>
      <div class="totals"><span id="itemCount" class="num">共 0 件</span><span>合計 <strong id="total" class="money">$0</strong></span></div>
    </div>

    <div>
      <div class="pay">
        <div class="lbl">應付金額</div>
        <div class="amount money" id="bigAmount">$0</div>
        <div id="payInfo"></div>
        <button class="payBtn" id="btnShowPay">放大給同事看</button>
      </div>
      <div class="panel sectionGap">
        <div class="form">
          <div class="two">
            <div><label>付款人姓名</label><input type="text" id="payer" placeholder="例：王小明"></div>
            <div><label>付款人帳號後 5 碼</label><input type="text" id="last5" maxlength="5" inputmode="numeric" placeholder="12345"></div>
          </div>
          <div class="two">
            <div><label>付款狀態</label>
              <select id="status"><option>已付款</option><option>待確認</option></select>
            </div>
            <div><label>備註</label><input type="text" id="note" placeholder="選填"></div>
          </div>
        </div>
        <div class="actions">
          <button class="btn danger" id="btnClear">清空</button>
          <button class="btn primary big" id="btnComplete">完成訂單</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 訂單紀錄 -->
<section class="page" id="page-orders" hidden>
  <div class="panel">
    <div class="filters">
      <div><label>開始日期</label><input type="date" id="oFrom"></div>
      <div><label>結束日期</label><input type="date" id="oTo"></div>
      <div><label>狀態</label><select id="oStatus"><option value="">全部</option><option>已付款</option><option>待確認</option></select></div>
      <div style="flex:1;min-width:200px"><label>搜尋</label><input type="text" id="oSearch" placeholder="訂單號、付款人、後 5 碼、品名"></div>
      <button class="btn" id="btnToday">今天</button>
      <button class="btn primary" id="btnExportDetail">匯出銷售明細</button>
    </div>
    <div class="stats" id="oStats"></div>
    <div class="tableWrap">
      <table>
        <thead><tr><th>訂單號</th><th>時間</th><th>付款人</th><th>後 5 碼</th><th class="num">件數</th><th class="num">金額</th><th>狀態</th><th></th></tr></thead>
        <tbody id="orderBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel sectionGap">
    <h2>月底開發票匯出</h2>
    <div class="filters" style="margin-bottom:6px">
      <div><label>月份</label><input type="month" id="oMonth"></div>
      <button class="btn primary" id="btnExportMonth">匯出月結 Excel</button>
    </div>
    <div class="note">只彙總「已付款」的訂單，依料號與單價合計數量和金額；「待確認」的訂單會另外列在一個工作表，提醒你先確認入帳。</div>
  </div>
</section>

<!-- 商品主檔 -->
<section class="page" id="page-products" hidden>
  <div class="panel">
    <div class="scanWrap">
      <input id="pScan" class="scan" type="text" placeholder="刷國際條碼：主檔有就跳到該品項，沒有就新增" autocomplete="off">
    </div>
    <div class="toolbar">
      <input type="text" id="pSearch" class="grow" placeholder="搜尋國條、料號、品名">
      <label style="display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap"><input type="checkbox" id="pNoPrice" style="width:auto">只看未定價</label>
      <button class="btn" id="btnImport">匯入主檔 Excel</button>
      <button class="btn" id="btnTemplate">下載匯入範本</button>
      <button class="btn" id="btnExportProducts">匯出主檔</button>
      <input type="file" id="fileImport" accept=".xlsx,.xls,.csv" hidden>
    </div>
    <div class="stats" id="pStats"></div>
    <div class="tableWrap">
      <table>
        <thead><tr><th>國際條碼</th><th>料號</th><th>品名</th><th class="num">售價</th><th></th></tr></thead>
        <tbody id="productBody"></tbody>
      </table>
    </div>
  </div>
</section>

<!-- 設定 -->
<section class="page" id="page-settings" hidden>
  <div class="panel" style="max-width:640px">
    <h2>匯款帳戶</h2>
    <div class="form">
      <div class="two">
        <div><label>銀行名稱</label><input type="text" id="sBankName" placeholder="例：國泰世華銀行"></div>
        <div><label>銀行代碼</label><input type="text" id="sBankCode" placeholder="例：013"></div>
      </div>
      <div><label>帳號</label><input type="text" id="sAccount" inputmode="numeric" placeholder="只填數字"></div>
      <div><label>戶名</label><input type="text" id="sAccountName" placeholder="例：明基佳世達健康股份有限公司"></div>
    </div>
    <div class="actions"><button class="btn primary" id="btnSaveSettings">儲存匯款帳戶</button></div>
  </div>

  <div class="panel sectionGap" style="max-width:640px">
    <h2>備份與還原</h2>
    <p class="note">所有資料存在這台電腦的瀏覽器裡。清除瀏覽器資料或換電腦，資料就會不見，請定期下載備份檔。</p>
    <p class="note" id="lastBackup"></p>
    <div class="actions">
      <button class="btn primary" id="btnBackup">下載備份檔</button>
      <button class="btn" id="btnRestore">從備份檔還原</button>
      <input type="file" id="fileRestore" accept=".json" hidden>
    </div>
  </div>
</section>
</main>

<div id="modal" hidden><div id="modalBox"></div></div>
<div id="toast" hidden></div>

<script>
const KEY='returnedStockPOS_v1';
let db={products:[],orders:[],cart:[],settings:{bankName:'',bankCode:'',account:'',accountName:'',lastBackup:null}};
let currentTab='checkout';
let expanded=new Set();

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
const pad=(n,l=2)=>String(n).padStart(l,'0');
const dayKey=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmtTime=t=>{const d=new Date(t);return `${dayKey(t)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const priceMissing=l=>l.price===null||l.price===undefined||l.price===''||isNaN(l.price);
const fmtAcct=a=>String(a||'').replace(/\s/g,'').replace(/(\d{4})(?=\d)/g,'$1 ');

function load(){
  try{const s=localStorage.getItem(KEY); if(s){const d=JSON.parse(s); db={...db,...d,settings:{...db.settings,...(d.settings||{})}}; if(!Array.isArray(db.cart))db.cart=[];}}
  catch(e){toast('讀取資料失敗，請用備份檔還原','warn')}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db))}
  catch(e){toast('資料沒有存成功：瀏覽器空間不足或被封鎖，請先下載備份檔','warn')}
  updateBackupWarn();
}

let toastTimer;
function toast(msg,type=''){const t=$('#toast');t.textContent=msg;t.className=type;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,type==='warn'?4500:3000)}

function openModal(html,wide=false){$('#modalBox').innerHTML=html;$('#modalBox').className=wide?'wide':'';$('#modal').hidden=false;const f=$('#modalBox').querySelector('[autofocus]');f&&f.focus()}
function closeModal(){$('#modal').hidden=true;$('#modalBox').innerHTML='';if(currentTab==='checkout')focusScan();if(currentTab==='products')$('#pScan').focus()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* ---------- 分頁 ---------- */
function showTab(t){
  currentTab=t;
  $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  $$('section.page').forEach(s=>s.hidden=s.id!=='page-'+t);
  if(t==='checkout'){renderCart();renderPayInfo();focusScan()}
  if(t==='orders')renderOrders();
  if(t==='products'){renderProducts();$('#pScan').focus()}
  if(t==='settings')renderSettings();
}
$$('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));

/* ---------- 商品查找 ---------- */
function findByCode(code){
  const c=code.trim().toLowerCase();
  return db.products.find(p=>p.barcode&&p.barcode.toLowerCase()===c)||db.products.find(p=>p.sku&&p.sku.toLowerCase()===c);
}
function searchProducts(q){
  q=q.trim().toLowerCase(); if(!q)return [];
  return db.products.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.sku||'').toLowerCase().includes(q)||(p.barcode||'').includes(q));
}

/* ---------- 結帳 ---------- */
function focusScan(){setTimeout(()=>{if($('#modal').hidden&&currentTab==='checkout')$('#scan').focus()},30)}
function cartTotal(){return db.cart.reduce((s,l)=>s+(priceMissing(l)?0:l.price*l.qty),0)}

function addToCart(p){
  let line=db.cart.find(l=>l.pid===p.id);
  if(line)line.qty++;
  else{line={pid:p.id,barcode:p.barcode||'',sku:p.sku||'',name:p.name||'',price:priceMissing(p)?null:p.price,qty:1};db.cart.push(line)}
  save();renderCart();
  const i=db.cart.indexOf(line);
  const row=$$('#cartBody tr')[i]; if(row){row.classList.add('flash')}
  if(priceMissing(line)){const el=document.querySelector(`.price[data-i="${i}"]`);el&&el.focus();toast(`「${line.name}」還沒有價格，請輸入單價`,'warn')}
  else focusScan();
}

function renderCart(){
  const tb=$('#cartBody');
  if(!db.cart.length){tb.innerHTML='<tr><td colspan="6" class="empty">請刷商品條碼開始結帳</td></tr>'}
  else tb.innerHTML=db.cart.map((l,i)=>`<tr>
    <td class="num">${i+1}</td>
    <td><div class="pname">${esc(l.name)}</div><div class="sub">料號 ${esc(l.sku||'—')}　條碼 ${esc(l.barcode||'—')}</div></td>
    <td class="num"><input class="price ${priceMissing(l)?'missing':''}" type="number" min="0" step="1" value="${priceMissing(l)?'':l.price}" data-i="${i}" placeholder="輸入單價"></td>
    <td><div class="qty"><button data-act="dec" data-i="${i}" aria-label="減少">−</button><input class="qtyin" type="number" min="1" value="${l.qty}" data-i="${i}"><button data-act="inc" data-i="${i}" aria-label="增加">+</button></div></td>
    <td class="num sub-cell">${priceMissing(l)?'—':money(l.price*l.qty)}</td>
    <td><button class="icon" data-act="del" data-i="${i}" title="刪除">✕</button></td>
  </tr>`).join('');
  updateTotal();
}
function updateTotal(){
  const t=cartTotal(), n=db.cart.reduce((s,l)=>s+l.qty,0);
  $('#total').textContent=money(t);$('#bigAmount').textContent=money(t);$('#itemCount').textContent=`共 ${n} 件`;
}
$('#cartBody').addEventListener('input',e=>{
  const i=+e.target.dataset.i, l=db.cart[i]; if(!l)return;
  if(e.target.classList.contains('price')){const v=e.target.value;l.price=v===''?null:Math.max(0,Math.round(+v));e.target.classList.toggle('missing',priceMissing(l))}

function showSug(q){
  const box=$('#sug');q=q.trim();
  if(!q||/^\d{6,}$/.test(q)){box.hidden=true;return}
  const m=searchProducts(q).slice(0,8);
  if(!m.length){box.hidden=true;return}
  box.innerHTML=m.map(p=>`<div data-id="${p.id}"><span>${esc(p.name)}<span class="sub">　${esc(p.sku||'')}</span></span><span class="num">${priceMissing(p)?'未定價':money(p.price)}</span></div>`).join('');

}
$('#sug').addEventListener('mousedown',e=>{const d=e.target.closest('[data-id]');if(!d)return;e.preventDefault();const p=db.products.find(x=>x.id===d.dataset.id);$('#scan').value='';$('#sug').hidden=true;p&&addToCart(p)});
$('#scan').addEventListener('input',e=>showSug(e.target.value));
$('#scan').addEventListener('blur',()=>setTimeout(()=>$('#sug').hidden=true,150));
$('#scan').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return; e.preventDefault();
  const code=e.target.value.trim(); if(!code)return;
  const p=findByCode(code);
  if(p){e.target.value='';$('#sug').hidden=true;addToCart(p);return}
  const isDigits=/^\d+$/.test(code);
  if(!isDigits){
    const m=searchProducts(code);
    if(m.length===1){e.target.value='';$('#sug').hidden=true;addToCart(m[0]);return}
    if(m.length>1){toast('有多個品項符合，請從清單點選');showSug(code);return}
  }
  e.target.value='';$('#sug').hidden=true;
  openNewProduct(code,true);
});

/* 完成訂單 */
$('#btnComplete').addEventListener('click',completeOrder);
function completeOrder(){
  if(!db.cart.length)return toast('還沒有任何品項','warn');
  const miss=db.cart.findIndex(priceMissing);
  if(miss>=0){toast(`第 ${miss+1} 項「${db.cart[miss].name}」還沒有單價`,'warn');const el=document.querySelector(`.price[data-i="${miss}"]`);el&&el.focus();return}
  const payer=$('#payer').value.trim(), last5=$('#last5').value.trim(), status=$('#status').value, note=$('#note').value.trim();
  if(last5&&!/^\d{5}$/.test(last5))return toast('帳號後 5 碼要剛好 5 位數字','warn');
  if(status==='已付款'&&!last5){toast('狀態是「已付款」時，請填付款人帳號後 5 碼；還沒確認入帳可改成「待確認」','warn');$('#last5').focus();return}

  const diffs=db.cart.map(l=>({l,p:db.products.find(x=>x.id===l.pid)})).filter(({l,p})=>p&&!priceMissing(p)&&p.price!==l.price);
  const info={payer,last5,status,note};
  if(!diffs.length)return finalize(info,[]);
  openModal(`<h3>這次的單價和主檔不同</h3>
    <p class="note">勾選的品項會把主檔售價改成這次的單價；沒勾的只套用在這筆訂單。</p>
    ${diffs.map(({l,p})=>`<label class="chk"><input type="checkbox" value="${p.id}"><span style="flex:1">${esc(l.name)}</span><span class="num">主檔 ${money(p.price)} → 本次 ${money(l.price)}</span></label>`).join('')}
    <div class="actions"><button class="btn" onclick="closeModal()">返回修改</button><button class="btn primary" id="btnDiffOk">完成訂單</button></div>`);
  $('#btnDiffOk').addEventListener('click',()=>{
    const ids=[...$$('#modalBox input[type=checkbox]:checked')].map(c=>c.value);
    closeModal();finalize(info,ids);
  });
}
function nextOrderNo(t){
  const d=new Date(t),prefix=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  let max=0;db.orders.forEach(o=>{if(o.no.startsWith(prefix+'-')){const n=parseInt(o.no.split('-')[1],10);if(n>max)max=n}});
  return `${prefix}-${pad(max+1,3)}`;
}
function finalize(info,updateIds){
  let written=0;
  db.cart.forEach(l=>{
    const p=db.products.find(x=>x.id===l.pid);if(!p)return;
    if(priceMissing(p)){p.price=l.price;written++}
    else if(updateIds.includes(p.id)){p.price=l.price;written++}
  });
  const now=Date.now(),no=nextOrderNo(now),total=cartTotal();
  db.orders.push({no,time:now,items:db.cart.map(l=>({pid:l.pid,barcode:l.barcode,sku:l.sku,name:l.name,price:l.price,qty:l.qty})),total,...info});
  db.cart=[];save();
  ['#payer','#last5','#note'].forEach(s=>$(s).value='');$('#status').value='已付款';
  renderCart();focusScan();
  toast(`訂單 ${no} 已完成，金額 ${money(total)}`+(written?`；已更新 ${written} 個品項的主檔售價`:''),'ok');
}

/* ---------- 訂單紀錄 ---------- */
function filteredOrders(){
  const from=$('#oFrom').value,to=$('#oTo').value,st=$('#oStatus').value,q=$('#oSearch').value.trim().toLowerCase();
  return db.orders.filter(o=>{
    const d=dayKey(o.time);
    if(from&&d<from)return false; if(to&&d>to)return false; if(st&&o.status!==st)return false;
    if(q){const hay=[o.no,o.payer,o.last5,o.note,...o.items.map(i=>i.name+' '+i.sku)].join(' ').toLowerCase();if(!hay.includes(q))return false}
    return true;
  }).sort((a,b)=>b.time-a.time);
}
function renderOrders(){
  const list=filteredOrders();

  $('#orderBody').innerHTML=list.map(o=>{
    const n=o.items.reduce((s,i)=>s+i.qty,0);
    let h=`<tr>
      <td class="num">${esc(o.no)}</td><td class="num">${fmtTime(o.time)}</td><td>${esc(o.payer||'—')}</td><td class="num">${esc(o.last5||'—')}</td>
      <td class="num">${n}</td><td class="num money">${money(o.total)}</td>
      <td><button class="pill ${o.status==='已付款'?'paid':'pending'}" data-act="toggle" data-no="${o.no}" title="點一下切換狀態">${o.status}</button></td>
      <td style="white-space:nowrap"><button class="btn" data-act="view" data-no="${o.no}">${expanded.has(o.no)?'收合':'明細'}</button> <button class="btn" data-act="edit" data-no="${o.no}">修改</button> <button class="icon" data-act="del" data-no="${o.no}" title="刪除訂單">✕</button></td>
    </tr>`;
    if(expanded.has(o.no))h+=`<tr class="detail"><td colspan="8">
      ${o.items.map(i=>`<div style="display:flex;gap:12px;padding:3px 0"><span style="flex:1">${esc(i.name)} <span class="sub">${esc(i.sku||'')}</span></span><span class="num">${money(i.price)} × ${i.qty}</span><span class="num" style="width:90px;text-align:right">${money(i.price*i.qty)}</span></div>`).join('')}
      ${o.note?`<div class="sub" style="margin-top:6px">備註：${esc(o.note)}</div>`:''}
    </td></tr>`;
    return h;

}

/* ---------- 匯出 ---------- */
function writeBook(sheets,filename){
  if(typeof XLSX==='undefined'){
    toast('Excel 元件沒有載入（需要連網），改用 CSV 下載','warn');
    sheets.forEach(sh=>{const csv=sh.rows.map(r=>r.map(c=>{const v=String(c??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
      download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),filename.replace(/\.xlsx$/,'')+'_'+sh.name+'.csv')});
    return;
  }
  const wb=XLSX.utils.book_new();
  sheets.forEach(sh=>{
    const ws=XLSX.utils.aoa_to_sheet(sh.rows);
    ws['!cols']=sh.cols?sh.cols.map(w=>({wch:w})):sh.rows[0].map(()=>({wch:14}));
    XLSX.utils.book_append_sheet(wb,ws,sh.name);
  });
  XLSX.writeFile(wb,filename);
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

$('#productBody').addEventListener('change',e=>{
  const tr=e.target.closest('tr[data-id]');if(!tr)return;
  const p=db.products.find(x=>x.id===tr.dataset.id);if(!p)return;
  const f=e.target.dataset.f;let v=e.target.value.trim();
  if(f==='price'){p.price=v===''?null:Math.max(0,Math.round(+v));e.target.classList.toggle('missing',priceMissing(p))}
  else if(f==='barcode'){if(v&&db.products.some(x=>x.id!==p.id&&x.barcode===v)){toast('其他品項已經用了這個國際條碼','warn');e.target.value=p.barcode;return}p.barcode=v}
  else if(f==='name'){if(!v){toast('品名不能空白','warn');e.target.value=p.name;return}p.name=v}
  else p[f]=v;
  save();
  if(f==='price'){const n=db.products.filter(priceMissing).length;$('#pStats').querySelectorAll('b')[1].textContent=n}
});
$('#productBody').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act="del"]');if(!b)return;
  const id=b.closest('tr').dataset.id,p=db.products.find(x=>x.id===id);
  if(p&&confirm(`確定從主檔刪除「${p.name}」嗎？（已成立的訂單不受影響）`)){db.products=db.products.filter(x=>x.id!==id);db.cart=db.cart.filter(l=>l.pid!==id);save();renderProducts()}
});
$('#pScan').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;e.preventDefault();
  const code=e.target.value.trim();if(!code)return;e.target.value='';
  const p=findByCode(code);
  if(p){
    $('#pSearch').value='';$('#pNoPrice').checked=false;flashId=p.id;renderProducts();
    const tr=document.querySelector(`#productBody tr[data-id="${p.id}"]`);
    if(tr){tr.scrollIntoView({block:'center'});tr.querySelector('[data-f="price"]').focus()}
    toast(`主檔已有「${p.name}」`);
  }else openNewProduct(code,false);
});

/* 匯入 */
function norm(v){if(v===null||v===undefined)return '';if(typeof v==='number')return Number.isInteger(v)?String(v):String(v);return String(v).trim()}
function detectCols(row){
  const m={barcode:-1,sku:-1,name:-1,price:-1};
  row.forEach((c,i)=>{const t=String(c||'').trim();if(!t)return;
    if(m.barcode<0&&/國條|國際條碼|條碼|barcode|ean/i.test(t))m.barcode=i;
    else if(m.sku<0&&/料號|品號|sku/i.test(t))m.sku=i;
    else if(m.name<0&&/品名|名稱|商品名/.test(t))m.name=i;
    else if(m.price<0&&/價/.test(t))m.price=i;});
  return m;
}
$('#btnImport').addEventListener('click',()=>{if(typeof XLSX==='undefined')return toast('Excel 元件沒有載入，請確認電腦有連網後重新整理頁面','warn');$('#fileImport').click()});
$('#fileImport').addEventListener('change',e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
      let hi=-1,map;
      for(let i=0;i<Math.min(10,rows.length);i++){const m=detectCols(rows[i]);if(m.barcode>=0||m.name>=0){hi=i;map=m;break}}
      if(hi<0)return toast('找不到欄位標題，第一列需要有「國際條碼」「料號」「品名」','warn');
      let add=0,upd=0,skip=0;
      rows.slice(hi+1).forEach(row=>{
        const bc=map.barcode>=0?norm(row[map.barcode]):'',sku=map.sku>=0?norm(row[map.sku]):'',name=map.name>=0?norm(row[map.name]):'';
        const pv=map.price>=0?norm(row[map.price]):'',price=pv!==''&&!isNaN(+pv)?Math.round(+pv):null;
        if(!bc&&!sku&&!name)return;
        if(!name&&!bc){skip++;return}
        let p=bc?db.products.find(x=>x.barcode===bc):db.products.find(x=>sku&&x.sku===sku&&!x.barcode);
        if(p){if(sku)p.sku=sku;if(name)p.name=name;if(price!==null)p.price=price;upd++}
        else{db.products.push({id:uid(),barcode:bc,sku,name:name||sku||bc,price,createdAt:Date.now()});add++}
      });
      save();renderProducts();
      toast(`匯入完成：新增 ${add} 筆、更新 ${upd} 筆`+(skip?`、略過 ${skip} 筆（沒有條碼也沒有品名）`:''),'ok');
    }catch(err){toast('檔案讀取失敗，請確認是 Excel 或 CSV 檔','warn')}
  };
  r.readAsArrayBuffer(file);
});
$('#btnTemplate').addEventListener('click',()=>writeBook([{name:'商品主檔',rows:[['國際條碼','料號','品名','售價'],['4710000000001','ABC-001','範例商品（請刪除此列）','']],cols:[18,14,36,10]}],'商品主檔_匯入範本.xlsx'));
$('#btnExportProducts').addEventListener('click',()=>{
  if(!db.products.length)return toast('主檔是空的','warn');
  const rows=[['國際條碼','料號','品名','售價']];db.products.forEach(p=>rows.push([p.barcode,p.sku,p.name,priceMissing(p)?'':p.price]));
  writeBook([{name:'商品主檔',rows,cols:[18,14,36,10]}],`商品主檔_${dayKey(Date.now())}.xlsx`);
});

/* ---------- 設定 ---------- */
function renderSettings(){
  const s=db.settings;
  $('#sBankName').value=s.bankName||'';$('#sBankCode').value=s.bankCode||'';$('#sAccount').value=s.account||'';$('#sAccountName').value=s.accountName||'';
  $('#lastBackup').textContent=s.lastBackup?`上次備份：${fmtTime(s.lastBackup)}`:'還沒有備份過。';
}
$('#btnSaveSettings').addEventListener('click',()=>{
  const acc=$('#sAccount').value.replace(/[\s-]/g,''),code=$('#sBankCode').value.trim();
  if(acc&&!/^\d+$/.test(acc))return toast('帳號只能是數字','warn');
  if(code&&!/^\d{3}$/.test(code))return toast('銀行代碼是 3 位數字','warn');
  Object.assign(db.settings,{bankName:$('#sBankName').value.trim(),bankCode:code,account:acc,accountName:$('#sAccountName').value.trim()});
  save();renderSettings();renderPayInfo();toast('已儲存匯款帳戶','ok');
});
$('#btnBackup').addEventListener('click',()=>{
  db.settings.lastBackup=Date.now();save();
  const d=new Date();download(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),`退貨品銷售備份_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`);
  renderSettings();toast('已下載備份檔','ok');
});
$('#btnRestore').addEventListener('click',()=>$('#fileRestore').click());
$('#fileRestore').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw 0;
      if(!confirm(`備份檔內有 ${d.products.length} 個商品、${d.orders.length} 筆訂單。\n還原會覆蓋目前這台電腦上的所有資料，確定嗎？`))return;
      db={products:d.products,orders:d.orders,cart:Array.isArray(d.cart)?d.cart:[],settings:{...db.settings,...(d.settings||{})}};
      save();renderSettings();renderPayInfo();toast('已從備份檔還原','ok');
    }catch(err){toast('這不是有效的備份檔','warn')}
  };
  r.readAsText(f);
});
function updateBackupWarn(){
  const w=$('#backupWarn'),lb=db.settings.lastBackup;
  const need=db.orders.length&&(!lb||Date.now()-lb>7*864e5);
  w.hidden=!need; if(need)w.textContent=lb?'超過 7 天沒備份，點這裡去備份':'還沒備份過資料，點這裡去備份';
}
$('#backupWarn').addEventListener('click',()=>showTab('settings'));

/* ---------- 啟動 ---------- */
load();
const today=dayKey(Date.now());$('#oFrom').value=today;$('#oTo').value=today;$('#oMonth').value=today.slice(0,7);
updateBackupWarn();showTab('checkout');
</script>
